<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leave Approved Email Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, Segoe UI, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 24px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    .subtitle { color: #94a3b8; margin: 0 0 20px; font-size: 0.9rem; }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tab {
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tab.active { outline: 2px solid #fff; outline-offset: 1px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .stage {
      background: #F5F7FB;
      border-radius: 12px;
      padding: 24px;
      max-width: 660px;
    }
  </style>
</head>
<body>
  <h1>Leave Approved email preview</h1>
  <p class="subtitle">Click a leave type to see header / headline / Leave Type value colors.</p>
  <div class="tabs" id="tabs"></div>
  <div class="stage" id="stage"></div>

  <script>
    const palette = [
      { name: 'Annual Leave', color: '#34d399' },
      { name: 'Sick Leave', color: '#f472b6' },
      { name: 'Maternity Leave', color: '#c084fc' },
      { name: 'Compassionate Leave', color: '#fb923c' },
      { name: 'Paternity Leave', color: '#60a5fa' },
      { name: 'Study Leave (custom)', color: '#38bdf8' },
    ];

    const sample = {
      employeeName: 'ALI BIN AHMAD',
      cc_emails: 'hr@example.com, manager@example.com',
      startDate: 'Monday, 20 Jul 2026',
      startTime: 'AM',
      endDate: 'Wednesday, 22 Jul 2026',
      endTime: 'PM',
      workingDays: '3',
      backToWorkDate: 'Thursday, 23 Jul 2026 (AM)',
      reason: 'Family vacation',
      approverName: 'SITI AMINAH',
      approvedDate: '15/07/2026',
    };

    function renderEmail(leaveType, color) {
      return `<!DOCTYPE html>
<html lang="en">
<body style="background:#F5F7FB; margin:0; padding:0;">
    <div style="width:100%; background:#F5F7FB; padding:0; font-family:Calibri,Arial,sans-serif;">
        <table align="center" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; margin:auto; background:#fff; border-radius:8px; overflow:hidden;">
            <tr>
                <td style="background:${color}; padding:15px 18px;">
                    <span style="font-size:18pt; color:#fff; font-weight:bold;">
                        LeaveApp
                    </span>
                </td>
            </tr>
            <tr>
                <td style="padding:18px;">
                    <p style="margin-top:0; margin-bottom:9pt; font-size:10.5pt; color:#4B5563;">
                        Dear <b>${sample.employeeName}</b>,
                    </p>
                    <p style="margin-top:0; margin-bottom:9pt; font-size:10.5pt; color:#4B5563;">
                        cc: <span style="color:#111827;">${sample.cc_emails}</span>
                    </p>
                    <p style="font-size:11.5pt; color:${color}; font-weight:bold;">
                        Your leave request has been <span style="text-transform:uppercase;">approved</span>.
                    </p>
                    <table width="100%" cellpadding="0" cellspacing="0"
                      style="width:100%; border-collapse:collapse; border:none; margin-bottom:30px; border-radius:8px; overflow:hidden;">
                        <tr style="background:#F9FAFB;">
                            <td style="padding:7.5pt; color:#374151; font-weight:bold; border:1px solid #E5E7EB; border-right:none; width:40%;">Leave Type</td>
                            <td style="padding:7.5pt; color:${color}; font-weight:bold; border:1px solid #E5E7EB; border-left:none;">${leaveType}</td>
                        </tr>
                        <tr>
                            <td style="padding:7.5pt; color:#374151; font-weight:bold; border:1px solid #E5E7EB; border-right:none;">Start Date</td>
                            <td style="padding:7.5pt; color:#111827; border:1px solid #E5E7EB; border-left:none;">${sample.startDate} (${sample.startTime})</td>
                        </tr>
                        <tr style="background:#F9FAFB;">
                            <td style="padding:7.5pt; color:#374151; font-weight:bold; border:1px solid #E5E7EB; border-right:none;">End Date</td>
                            <td style="padding:7.5pt; color:#111827; border:1px solid #E5E7EB; border-left:none;">${sample.endDate} (${sample.endTime})</td>
                        </tr>
                        <tr>
                            <td style="padding:7.5pt; color:#374151; font-weight:bold; border:1px solid #E5E7EB; border-right:none;">Working Days</td>
                            <td style="padding:7.5pt; color:#111827; border:1px solid #E5E7EB; border-left:none;">${sample.workingDays}</td>
                        </tr>
                        <tr style="background:#F9FAFB;">
                            <td style="padding:7.5pt; color:#374151; font-weight:bold; border:1px solid #E5E7EB; border-right:none;">Back to Work</td>
                            <td style="padding:7.5pt; color:#111827; border:1px solid #E5E7EB; border-left:none;">${sample.backToWorkDate}</td>
                        </tr>
                        <tr>
                            <td style="padding:7.5pt; color:#374151; font-weight:bold; border:1px solid #E5E7EB; border-right:none;">Reason</td>
                            <td style="padding:7.5pt; color:#111827; border:1px solid #E5E7EB; border-left:none;">${sample.reason}</td>
                        </tr>
                    </table>
                    <table width="100%" cellpadding="0" cellspacing="0" style="width:100%;margin-bottom:15px;">
                        <tr>
                            <td style="width:40%;padding:4px 0;color:#374151;font-weight:bold;">Approved by</td>
                            <td style="padding:4px 0;color:#111827;">${sample.approverName}</td>
                        </tr>
                        <tr>
                            <td style="width:40%;padding:4px 0;color:#374151;font-weight:bold;">Approved on</td>
                            <td style="padding:4px 0;color:#111827;">${sample.approvedDate}</td>
                        </tr>
                    </table>
                    <p style="font-size:11.5pt; color:#4B5563;">
                        Please ensure all your work is properly handed over before your leave period.
                    </p>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>`;
    }

    const tabs = document.getElementById('tabs');
    const stage = document.getElementById('stage');

    function select(i) {
      [...tabs.children].forEach((el, idx) => el.classList.toggle('active', idx === i));
      const item = palette[i];
      stage.innerHTML = renderEmail(item.name, item.color);
    }

    palette.forEach((item, i) => {
      const btn = document.createElement('button');
      btn.className = 'tab' + (i === 0 ? ' active' : '');
      btn.innerHTML = `<span class="dot" style="background:${item.color}"></span>${item.name}`;
      btn.onclick = () => select(i);
      tabs.appendChild(btn);
    });

    select(0);
  </script>
</body>
</html>
